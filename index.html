<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Révise le code de la route avec des rappels J+1, J+3, J+7, J+14 et J+30 : cours, quiz, panneaux et examen blanc.">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font:14px/1.5 system-ui,sans-serif;-webkit-text-size-adjust:100%}

<title>Ancre ton permis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: carnet de révision — accueil (aujourd'hui, outils, historique, 10 thèmes), puis une colonne étroite pour cours et quiz */
:root{
  --bg:#f3f4f1; --surface:#ffffff; --ink:#1b1f1d; --muted:#5d6661; --line:#d9ddd8;
  --accent:#1f6f5c; --accent-ink:#ffffff; --good:#1d7a3e; --good-bg:#e3f3e8; --bad:#b3261e; --bad-bg:#fbe7e5;
  --L:#d4920f; --C:#2f62b5; --R:#d9412b; --U:#6b3fa0; --D:#b8164f; --A:#d63a6b; --P:#2b2b2b; --M:#2a8f8a; --S:#3c8a2e; --E:#6f9a22;
  --display:"Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1b201e; --ink:#e9ece9; --muted:#9aa49f; --line:#2e3532;
  --accent:#4fbf9f; --accent-ink:#0d1311; --good:#6fd08f; --good-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1b19; --P:#6b6f6d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201e; --ink:#e9ece9; --muted:#9aa49f; --line:#2e3532;
  --accent:#4fbf9f; --accent-ink:#0d1311; --good:#6fd08f; --good-bg:#16301f; --bad:#ff8a80; --bad-bg:#3a1b19; --P:#6b6f6d; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.02em;line-height:1}
h1 .anchor{display:inline-block;transform:rotate(-8deg);color:var(--accent)}
h2{font-size:1.5rem;font-weight:800}
h3{font-size:1.1rem;font-weight:600}
.lede{color:var(--muted);max-width:62ch;margin:.6rem 0 0}
.muted{color:var(--muted)} .small{font-size:.85rem} .mt0{margin-top:0} .mb0{margin-bottom:0} .mt{margin-top:24px} .center{text-align:center;justify-content:center}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:24px}
.stats{display:flex;flex-wrap:wrap;gap:18px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:1.5rem}
.stats span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.btn{font:700 1rem var(--body);border:0;border-radius:10px;padding:.75rem 1.2rem;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.light{background:var(--bg);color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,.tile:focus-visible,.card-sign:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.today,.hist{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:24px}
.today-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.ladder{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem;font-variant-numeric:tabular-nums}
.ladder span{padding:.15rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.due-list{display:grid;gap:8px}
.due{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;background:var(--bg);min-width:0}
.due .badge{width:34px;height:38px;font-size:1.15rem}
.due .t{flex:1;min-width:0}
.due .t small{color:var(--muted);display:block}
.due .btn{padding:.5rem .9rem;font-size:.9rem;flex:none}
.late{color:var(--bad);font-weight:700}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:24px}
.tool{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.tool p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.tool .btn{align-self:flex-start}
.tool.dark{background:var(--ink);border-color:var(--ink)}
.tool.dark h3{color:var(--bg)} .tool.dark p{color:var(--bg);opacity:.8}
.chart{overflow-x:auto} .chart svg{width:100%;height:170px;display:block;min-width:300px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.tile:hover{border-color:var(--muted)}
.badge{flex:none;width:44px;height:48px;display:grid;place-items:center;font:800 1.5rem var(--display);color:#fff;clip-path:polygon(0 0,100% 0,88% 100%,0 100%);background:var(--c)}
.tile .t{min-width:0;flex:1;display:flex;flex-direction:column}
.tile h3{margin-bottom:2px}
.tile small{color:var(--muted);line-height:1.35}
.steps{display:flex;gap:4px;margin-top:10px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--c)}
.score-chip{font-size:.75rem;color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.pill{align-self:flex-start;display:inline-block;font-size:.72rem;font-weight:700;padding:.12rem .5rem;border-radius:999px;margin-top:6px}
.pill.due-now{background:var(--bad-bg);color:var(--bad)}
.pill.later{background:var(--good-bg);color:var(--good)}
.pill.new{background:var(--line);color:var(--muted)}
.col{max-width:660px;margin:0 auto} .col.wide{max-width:900px}
.back{background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;padding:0;margin-bottom:18px}
.head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.head-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:14px}
.course{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:12px}
.course h3{margin-bottom:10px}
.course ul{margin:0;padding-left:1.1rem;display:grid;gap:7px}
.course li::marker{color:var(--c,var(--accent))}
.sticky-cta{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
.sticky-cta .btn{width:100%}
.progress{display:flex;justify-content:space-between;gap:10px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:8px}
.clock{font-weight:700;color:var(--ink)} .clock.urgent{color:var(--bad)}
.bar,.timebar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:18px}
.timebar{height:3px;margin-top:-12px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));transition:width .25s}
.timebar i{display:block;height:100%;background:var(--ink);transition:width 1s linear}
.q{font-size:1.2rem;font-weight:700;margin:0 0 4px}
.hint{font-size:.8rem;color:var(--muted);margin:0 0 14px}
.sign-big{display:flex;justify-content:center;margin:4px 0 16px}
.sign-sm svg{width:56px;height:56px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt b{font-family:var(--display);flex:none;width:1.6rem;height:1.6rem;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem}
.opt:hover:not([disabled]){border-color:var(--muted)}
.opt.sel{border-color:var(--c,var(--accent))} .opt.sel b{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-bg)} .opt.ok b{border-color:var(--good)}
.opt.ko{border-color:var(--bad);background:var(--bad-bg)}
.opt[disabled]{cursor:default}
.fb{margin-top:6px;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:var(--good)} .fb.ko strong{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px}
.result{text-align:center;padding:10px 0 6px}
.big{font:800 4rem var(--display);line-height:1;font-variant-numeric:tabular-nums}
.big .of{font-size:1.6rem;color:var(--muted)}
.verdict{display:inline-block;margin-top:10px;padding:.35rem .8rem;border-radius:999px;font-weight:700}
.verdict.ok{background:var(--good-bg);color:var(--good)} .verdict.ko{background:var(--bad-bg);color:var(--bad)}
.next-box{margin:20px auto 0;max-width:440px;text-align:center;padding:14px 16px;border:1px dashed var(--line);border-radius:12px}
.next-box .eyebrow{display:block;margin-bottom:4px}
.next-box b{font-family:var(--display);font-size:1.3rem;display:block}
.review{display:grid;gap:10px}
.rv{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;min-width:0}
.rv p{margin:.25rem 0 0;font-size:.95rem}
.rv .m{color:var(--muted);font-size:.8rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.85rem;padding:.25rem .6rem;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card-sign{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px;cursor:pointer;font:inherit;color:inherit;min-width:0}
.card-sign.open{border-color:var(--accent)}
.card-sign .nm{font-weight:700;font-size:.92rem;line-height:1.3}
.card-sign .ds{font-size:.82rem;color:var(--muted);line-height:1.35}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-variant-numeric:tabular-nums;font-weight:700}
tr:last-child td{border-bottom:0}
.foot{margin-top:36px;font-size:.8rem;color:var(--muted);max-width:65ch}
@media (max-width:480px){.due{flex-wrap:wrap}.due .btn{width:100%}.big{font-size:3.2rem}}
@media (prefers-reduced-motion:reduce){.bar i,.timebar i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const THEMES = [
 {k:"L",name:"Législation",sub:"Signalisation, priorités, vitesse, arrêt et stationnement, croisement et dépassement",
  cours:[
   {h:"Les priorités",items:["Sans panneau, feu ni marquage : priorité à droite.","Exception : en sortant d'un parking, d'une station-service, d'un chemin de terre ou d'une propriété privée, vous cédez le passage à tout le monde.","Ordre d'importance : agent de circulation, puis feux, puis panneaux, puis règles générales (priorité à droite).","Giratoire avec « cédez le passage » à l'entrée : les véhicules déjà sur l'anneau sont prioritaires. Clignotant obligatoire pour en sortir."]},
   {h:"Les vitesses maximales (temps sec)",items:["Agglomération : 50 km/h, souvent 30 km/h selon les panneaux.","Route bidirectionnelle sans séparateur : 80 km/h (90 si un panneau l'indique).","Route à chaussées séparées par un terre-plein : 110 km/h.","Autoroute : 130 km/h. Jeune conducteur : 110 sur autoroute, 100 sur chaussées séparées, 80 ailleurs."]},
   {h:"Feux et panneaux d'arrêt",items:["STOP : arrêt complet à la ligne, même si personne n'arrive.","Cédez le passage : on ralentit et on cède ; l'arrêt n'est obligatoire que si quelqu'un arrive.","Feu jaune fixe : on s'arrête, sauf si l'arrêt serait dangereux.","Feux rouges clignotants alternés (passage à niveau) : arrêt absolu."]},
   {h:"Croisement, dépassement, stationnement",items:["Ligne continue : interdit de la franchir, sauf pour dépasser un cycliste ou un engin lent avec une visibilité suffisante.","Flèche de rabattement au sol : la voie ou la ligne discontinue se termine, rabattez-vous.","On dépasse par la droite un véhicule qui tourne à gauche (après s'être déporté) et, en général, un tramway.","Arrêt : le conducteur reste au volant ou à proximité, le temps de faire monter ou descendre. Stationnement : au-delà.","Route de montagne étroite : c'est en principe le véhicule qui descend qui doit manœuvrer."]}
  ]},
 {k:"C",name:"Conducteur",sub:"Vigilance, distances de sécurité, alcool, fatigue, téléphone",
  cours:[
   {h:"Alcool et produits",items:["Taux maximal : 0,5 g/l de sang (0,25 mg/l d'air expiré). En probatoire : 0,2 g/l, donc zéro verre.","À partir de 0,8 g/l de sang (0,4 mg/l d'air) : délit.","Seul le temps fait baisser le taux d'alcool. Ni café, ni eau, ni repas n'accélèrent l'élimination.","Stupéfiants au volant : délit et 6 points retirés.","Médicaments : pictogramme jaune (soyez prudent), orange (soyez très prudent), rouge (ne conduisez pas)."]},
   {h:"Distances et perception",items:["Temps de réaction moyen : environ 1 seconde.","Distance d'arrêt = distance parcourue pendant le temps de réaction + distance de freinage.","Si la vitesse double, la distance de freinage est multipliée par environ 4.","Distance de sécurité : au moins 2 secondes, soit environ 50 m à 90 km/h.","Plus la vitesse augmente, plus le champ de vision se rétrécit."]},
   {h:"Fatigue et distractions",items:["Pause conseillée toutes les 2 heures.","Signes de somnolence : bâillements, paupières lourdes, picotements des yeux, raideur de la nuque.","Seul remède : s'arrêter et dormir 15 à 20 minutes. Ouvrir la fenêtre ou monter le son ne suffit pas.","Téléphone tenu en main : 135 € et 3 points. Oreillettes et casques interdits.","Regarder un écran autre qu'une aide à la conduite ou à la navigation est interdit."]}
  ]},
 {k:"R",name:"Route",sub:"Visibilité et adhérence réduites, conditions dégradées, autoroute",
  cours:[
   {h:"Pluie, brouillard, neige",items:["Pluie : 110 au lieu de 130 sur autoroute, 100 au lieu de 110, 80 au lieu de 90.","Visibilité inférieure à 50 m : 50 km/h maximum partout.","Feux de brouillard arrière : seulement par brouillard ou chute de neige, jamais pour la seule pluie.","Aquaplaning : lever le pied, tenir le volant, ne pas freiner brusquement.","Route glissante : freinage doux, distances augmentées, pas de régulateur de vitesse."]},
   {h:"Autoroute",items:["Sur la bretelle d'accès, on adapte sa vitesse et on cède le passage aux véhicules déjà sur l'autoroute.","Voie de gauche : au moins 80 km/h par beau temps.","Marche arrière et demi-tour interdits, y compris sur les bretelles.","Bande d'arrêt d'urgence : seulement en cas de vraie urgence.","En panne : feux de détresse, gilet enfilé avant de sortir, passagers derrière la glissière, appel avec une borne ou le 112."]},
   {h:"Nuit, tunnels, montagne",items:["De nuit, adaptez votre vitesse à la portée de vos feux. Feux de croisement quand vous croisez ou suivez quelqu'un.","Si vous êtes ébloui : regardez le bord droit de la chaussée et ralentissez.","Tunnel : feux de croisement allumés, demi-tour interdit.","En descente de montagne : rapport inférieur pour utiliser le frein moteur.","Équipé de chaînes : 50 km/h maximum. Dans certaines communes de montagne, équipements hiver obligatoires du 1er novembre au 31 mars."]}
  ]},
 {k:"U",name:"Usagers",sub:"Usagers vulnérables, motos, poids lourds, transports en commun, véhicules prioritaires",
  cours:[
   {h:"Usagers vulnérables",items:["Pour dépasser un cycliste : 1 m en agglomération, 1,50 m hors agglomération.","Un piéton engagé, ou qui montre clairement l'intention de traverser, est prioritaire.","Une personne avec une canne blanche ou un chien guide a toujours la priorité.","Un ballon qui roule sur la chaussée annonce souvent un enfant.","Hors agglomération sans trottoir, les piétons marchent à gauche, face aux véhicules.","Sas vélo aux feux : les voitures s'arrêtent avant la première ligne."]},
   {h:"Deux-roues motorisés et trottinettes",items:["Les motos sont petites et rapides : rétroviseurs et angles morts avant chaque changement de direction.","Les trottinettes électriques ne roulent pas sur les trottoirs, sauf poussées à la main."]},
   {h:"Gros véhicules",items:["Poids lourds : grands angles morts. Si vous ne voyez pas ses rétroviseurs, il ne vous voit pas.","Un poids lourd qui tourne à droite se déporte parfois d'abord à gauche : ne vous glissez pas à sa droite.","En agglomération, laissez sortir un bus qui signale son départ de l'arrêt.","Car scolaire à l'arrêt avec feux de détresse : ralentissez fortement.","Engin agricole : dépassez seulement avec une bonne visibilité, attention à sa largeur."]},
   {h:"Véhicules prioritaires",items:["Gyrophare bleu et sirène (pompiers, police, SAMU) : facilitez leur passage.","Gyrophare orange (dépanneuse, engin de travaux) : il signale un obstacle ou un danger, il n'est pas prioritaire. Ralentissez.","Le tramway est en général prioritaire."]}
  ]},
 {k:"D",name:"Réglementation",sub:"Papiers, permis à points, infractions et sanctions, passagers et chargement",
  cours:[
   {h:"Le permis à points",items:["Permis probatoire : 6 points au départ, 3 ans (2 ans après une conduite accompagnée).","Chaque année sans infraction : +2 points (+3 après conduite accompagnée).","On ne perd pas plus de 8 points en une fois.","Une infraction à 1 point : le point revient après 6 mois sans nouvelle infraction.","Stage de sensibilisation : jusqu'à 4 points récupérés, une fois par an maximum.","Solde à zéro : permis invalidé, il faut attendre au moins 6 mois pour le repasser."]},
   {h:"Les sanctions courantes",items:["Excès de vitesse de moins de 20 km/h (route limitée à plus de 50) : 1 point.","Feu rouge ou STOP non respecté : 4 points.","Ceinture non bouclée : 3 points. Téléphone tenu en main : 3 points.","Stationnement sur un trottoir : stationnement très gênant (135 €)."]},
   {h:"Papiers et véhicule",items:["Au contrôle : permis et certificat d'immatriculation. L'assurance est vérifiée dans le fichier des véhicules assurés.","Assurance minimale obligatoire : la responsabilité civile (« au tiers »).","Contrôle technique : dans les 4 ans suivant la première mise en circulation, puis tous les 2 ans.","Changement d'adresse : à déclarer sur le certificat d'immatriculation dans le mois.","Constat amiable : à envoyer à son assureur dans les 5 jours ouvrés."]},
   {h:"Passagers et chargement",items:["Pas plus de passagers que de places équipées de ceinture.","Chargement qui dépasse de plus d'1 m à l'arrière : il doit être signalé.","Permis B : remorque jusqu'à 750 kg de PTAC sans formation supplémentaire."]}
  ]},
 {k:"A",name:"Secours",sub:"Règles et comportements à adopter sur les lieux d'un accident",
  cours:[
   {h:"Protéger",items:["Feux de détresse, garez-vous après l'accident, gilet enfilé.","Triangle placé à au moins 30 m, visible des autres usagers.","Coupez le contact des véhicules accidentés et interdisez de fumer."]},
   {h:"Alerter",items:["112 (urgence européen), 15 (SAMU), 18 (pompiers), 17 (police), 114 par SMS.","Donnez le lieu précis, le nombre de victimes et leur état.","Ne raccrochez pas le premier : les secours peuvent avoir des questions."]},
   {h:"Secourir",items:["Ne déplacez pas un blessé, sauf danger immédiat (incendie, risque de nouvel accident).","Ne retirez jamais le casque d'un motard.","Victime consciente : parlez-lui, couvrez-la, ne lui donnez ni à boire ni à manger.","Victime inconsciente qui respire : position latérale de sécurité (PLS).","Victime qui ne respire pas : alerte, massage cardiaque (100 à 120 compressions par minute) et défibrillateur.","Saignement abondant : appuyez fortement sur la plaie."]}
  ]},
 {k:"P",name:"Précautions",sub:"Prendre et quitter le véhicule, position de conduite",
  cours:[

   {h:"Pneumatiques",items:["Rainures : 1,6 mm minimum, avec des témoins d'usure dans les rainures.","Pression contrôlée à froid, environ une fois par mois.","Pneu sous-gonflé : moins d'adhérence, usure plus rapide, surconsommation.","Roue de secours temporaire (galette) : vitesse limitée, souvent à 80 km/h."]},

  ]},
 {k:"S",name:"Sécurité",sub:"Installation des enfants et des passagers, équipements de sécurité",

   {h:"Enfants et passagers",items:["Moins de 10 ans : siège ou rehausseur adapté.","Bébé : dos à la route au moins jusqu'à 15 mois.","Siège dos à la route à l'avant : airbag passager désactivé.","Un enfant de moins de 10 ans ne voyage pas à l'avant, sauf exceptions (bébé dos à la route, pas de places arrière, places arrière déjà occupées par des enfants).","Ceinture obligatoire à toutes les places. Le conducteur est responsable des passagers mineurs.","Femme enceinte : ceinture obligatoire, sangle basse sous le ventre."]},

   {h:"Chargement",items:["Objets lourds au fond du coffre, contre la banquette.","Un objet non arrimé devient un projectile en cas de choc.","Un véhicule surchargé freine moins bien."]}
  ]},
 {k:"E",name:"Environnement",sub:"Utilisation du véhicule et respect de l'environnement",

   {h:"Écoconduite",items:["Anticipez, roulez en souplesse, passez les rapports tôt.","En décélération avec une vitesse engagée, la plupart des moteurs ne consomment presque plus.","La consommation augmente fortement avec la vitesse.","Sur autoroute, le régulateur de vitesse aide à garder une allure stable."]},
   {h:"Ce qui fait consommer",items:["Climatisation, galerie de toit même vide, pneus sous-gonflés, charge inutile.","Faire chauffer le moteur à l'arrêt : inutile, partez en douceur."]},

 {c:"Zone",n:"Zone 30",s:`<rect x="10" y="6" width="80" height="88" rx="6" fill="${W}" stroke="${K}" stroke-width="2"/>${txt("ZONE",28,16,K)}<circle cx="50" cy="60" r="26" fill="${W}" stroke="${R}" stroke-width="6"/>${txt("30",71,28,K)}`,d:"Dans toute la zone, vitesse limitée à 30 km/h."}
];
const signSvg=(s,size)=>`<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="Panneau">${s.s}</svg>`;

const KEYS=[
 {h:"Vitesses maximales (temps sec / pluie)",cols:["Route","Normal","Pluie","Jeune conducteur"],rows:[["Autoroute","130","110","110"],["Chaussées séparées","110","100","100"],["Route bidirectionnelle","80 (90 si panneau)","80","80"],["Agglomération","50","50","50"],["Visibilité < 50 m","50 partout","",""]]},
 {h:"Alcool",cols:["Situation","Sang","Air expiré"],rows:[["Conducteur expérimenté","0,5 g/l","0,25 mg/l"],["Permis probatoire","0,2 g/l","0,10 mg/l"],["Délit (tous)","0,8 g/l","0,40 mg/l"]]},
 {h:"Points",cols:["Infraction ou règle","Points"],rows:[["Capital probatoire au départ","6"],["Gain par an en probatoire","+2 (+3 après AAC)"],["Retrait maximal en une fois","8"],["Feu rouge ou STOP","−4"],["Ceinture, téléphone tenu en main","−3"],["Excès < 20 km/h (limite > 50)","−1"],["Stupéfiants","−6"],["Stage de sensibilisation","+4 max"]]},
 {h:"Distances",cols:["Repère","Valeur"],rows:[["Distance de sécurité","2 secondes"],["Dépasser un cycliste ou un piéton","1 m en ville, 1,50 m hors ville"],["Triangle de présignalisation","au moins 30 m"],["Portée feux de croisement","environ 30 m"],["Portée feux de route","environ 100 m"],["Pneus : rainures minimales","1,6 mm"]]},
 {h:"Numéros d'urgence",cols:["Numéro","Service"],rows:[["112","Urgence européen"],["15","SAMU"],["18","Pompiers"],["17","Police, gendarmerie"],["114","Alerte par SMS"]]}
];

const LETTERS=["A","B","C","D"];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let best=store.get("atp-best",{}), sched=store.get("atp-sched",{}), errs=store.get("atp-errs",{}), hist=store.get("atp-hist",[]);
const STEPS=[1,3,7,14,30], ERR_STEPS=[1,3,7], PASS_RATE=0.8, EXAM_SECONDS=20;
const app=document.getElementById("app");
const T=k=>THEMES.find(t=>t.k===k);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dayKey=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`};
const todayKey=()=>dayKey(new Date());
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dayKey(d)};
const diffDays=(a,b)=>Math.round((parseKey(a)-parseKey(b))/86400000);
const fmtDate=k=>parseKey(k).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
const fmtShort=k=>parseKey(k).toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const qCount=k=>Q.filter(q=>q.t===k).length;
let timer=null; const stopTimer=()=>{if(timer){clearInterval(timer);timer=null}};

function updateSched(k,rate){
  const t=todayKey(),s=sched[k]; let step;
  if(!s) step=0; else if(rate>=PASS_RATE) step=s.last===t?s.step:Math.min(s.step+1,STEPS.length-1); else step=0;
  sched[k]={step,last:t,due:addDays(t,STEPS[step])}; store.set("atp-sched",sched); return sched[k];
}
function status(k){
  const s=sched[k]; if(!s) return {kind:"new",label:"Pas encore commencé"};
  const d=diffDays(s.due,todayKey());
  if(d<0) return {kind:"due",label:`En retard de ${-d} jour${-d>1?"s":""}`,late:true};
  if(d===0) return {kind:"due",label:"À réviser aujourd'hui"};
  return {kind:"later",label:`J+${STEPS[s.step]} · ${d===1?"demain":"dans "+d+" jours"}`};
}
const pillClass=st=>st.kind==="due"?"due-now":st.kind==="later"?"later":"new";
const errDue=()=>Object.entries(errs).filter(([,e])=>diffDays(e.due,todayKey())<=0).map(([id])=>Q[+id]).filter(Boolean);
function markWrong(q){ if(q.id==null)return; errs[q.id]={step:0,due:addDays(todayKey(),ERR_STEPS[0])}; store.set("atp-errs",errs) }
function markErrRight(q){
  const e=errs[q.id]; if(!e)return null;
  if(e.step+1>=ERR_STEPS.length){delete errs[q.id];store.set("atp-errs",errs);return "acquise"}
  e.step++; e.due=addDays(todayKey(),ERR_STEPS[e.step]); store.set("atp-errs",errs); return e;
}

/* ---------- Accueil ---------- */
function home(){
  stopTimer();
  const done=THEMES.filter(t=>best[t.k]!=null).length, ex=best.EXAM;
  const dueThemes=THEMES.filter(t=>status(t.k).kind==="due").sort((a,b)=>sched[a.k].due.localeCompare(sched[b.k].due));
  const fresh=THEMES.filter(t=>!sched[t.k]);
  const upcoming=THEMES.filter(t=>status(t.k).kind==="later").map(t=>sched[t.k].due).sort()[0];
  const ed=errDue(), errTotal=Object.keys(errs).length;
  const row=(c,badge,title,sub,btn,act)=>`<div class="due" style="--c:${c}"><span class="badge">${badge}</span><div class="t"><b>${title}</b><small>${sub}</small></div><button class="btn" style="background:var(--c);color:#fff" data-act="${act}">${btn}</button></div>`;
  let rows=dueThemes.map(t=>{const st=status(t.k);return row(`var(--${t.k})`,t.k,t.name,`<span class="${st.late?"late":""}">${st.label}</span> · palier J+${STEPS[sched[t.k].step]}`,"Réviser","theme:"+t.k)});
  if(ed.length) rows.unshift(row("var(--bad)","!","Mes erreurs",`${ed.length} question${ed.length>1?"s":""} à revoir aujourd'hui`,"Revoir","errors"));
  let todayHtml;
  if(rows.length) todayHtml=`<div class="due-list">${rows.join("")}</div>`;
  else if(fresh.length) todayHtml=`<p class="mt0">Aucune révision prévue aujourd'hui. Commence un nouveau thème :</p><div class="due-list">${row(`var(--${fresh[0].k})`,fresh[0].k,fresh[0].name,"Premier passage, puis révision à J+1","Commencer","theme:"+fresh[0].k)}</div>`;
  else todayHtml=`<p class="mt0">Tout est à jour. Prochaine révision ${upcoming?"le "+fmtDate(upcoming):"bientôt"}.</p>`;
  const nbDue=dueThemes.length+(ed.length?1:0);
  app.innerHTML=`
  <div class="top"><div><h1>Ancre ton permis <span class="anchor">⚓</span></h1>
  <p class="lede">Apprends un thème, puis reviens-y à J+1, J+3, J+7, J+14 et J+30. Une révision réussie (80 % ou plus) t'envoie au palier suivant ; sinon tu repars à J+1. Tes erreurs reviennent aussi d'elles-mêmes.</p></div>
  <div class="stats"><div><b>${done}/10</b><span>Thèmes faits</span></div><div><b>${nbDue}</b><span>À réviser</span></div><div><b>${ex!=null?ex+"/40":"—"}</b><span>Meilleur examen</span></div></div></div>
  <section class="today"><div class="today-head"><h2>Aujourd'hui</h2><div class="ladder">${STEPS.map(s=>`<span>J+${s}</span>`).join("")}</div></div>${todayHtml}</section>
  <div class="tools">
    <div class="tool dark"><h3>Examen blanc</h3><p>40 questions, ${EXAM_SECONDS} secondes chacune, comme le jour J. Il faut 35 bonnes réponses.</p><button class="btn light" data-act="exam">Lancer l'examen</button></div>
    <div class="tool"><h3>Mes erreurs</h3><p>${errTotal?`${errTotal} question${errTotal>1?"s":""} en cours d'ancrage. Chacune revient à J+1, J+3 puis J+7.`:"Les questions ratées arriveront ici automatiquement."}</p><button class="btn ghost" data-act="errview">Ouvrir</button></div>
    <div class="tool"><h3>Panneaux</h3><p>${SIGNS.length} panneaux à reconnaître, en cartes et en quiz.</p><button class="btn ghost" data-act="signs">Ouvrir</button></div>
    <div class="tool"><h3>Chiffres clés</h3><p>Vitesses, alcool, points, distances et numéros d'urgence sur une seule fiche.</p><button class="btn ghost" data-act="keys">Ouvrir</button></div>
  </div>
  ${histHtml()}
  <p class="eyebrow">Les 10 thèmes · ${Q.length} questions</p>
  <div class="grid">${THEMES.map(t=>{const n=qCount(t.k),b=best[t.k],st=status(t.k),s=sched[t.k];return `
    <button class="tile" style="--c:var(--${t.k})" data-act="theme:${t.k}"><span class="badge">${t.k}</span><span class="t"><h3>${t.name}</h3><small>${t.sub}</small>
    <span class="steps">${STEPS.map((_,i)=>`<i class="${s&&i<=s.step?"on":""}"></i>`).join("")}</span>
    <span class="score-chip">${b!=null?`Meilleur score ${b}/${n}`:`${n} questions`}</span>
    <span class="pill ${pillClass(st)}">${st.label}</span></span></button>`}).join("")}</div>
  <p class="foot">Questions et cours d'entraînement rédigés pour cette appli, pas la banque officielle de l'examen. Les règles peuvent évoluer : vérifie les points importants sur securite-routiere.gouv.fr ou service-public.fr. Ta progression est enregistrée dans ce navigateur.</p>`;
  bindActs(); scrollTo(0,0);
}
function histHtml(){
  if(!hist.length) return "";
  const pts=hist.slice(-15), W=600,H=170,pl=34,pr=12,pt=14,pb=26, y0=20,y1=40;
  const x=i=>pl+(pts.length===1?(W-pl-pr)/2:i*(W-pl-pr)/(pts.length-1));
  const y=v=>pt+(1-(Math.max(v,y0)-y0)/(y1-y0))*(H-pt-pb);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)} ${y(p.s).toFixed(1)}`).join(" ");
  const area=`${line} L${x(pts.length-1).toFixed(1)} ${H-pb} L${x(0).toFixed(1)} ${H-pb} Z`;
  const ticks=[20,25,30,35,40].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v===35?'stroke-dasharray="4 4" stroke="var(--good)"':''}/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`).join("");
  const dots=pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.s)}" r="${i===pts.length-1?5:3.5}" fill="${p.s>=35?"var(--good)":"var(--bad)"}"/>`).join("");
  const last=pts[pts.length-1], streak=(()=>{let n=0;for(let i=hist.length-1;i>=0&&hist[i].s>=37;i--)n++;return n})();
  return `<section class="hist"><div class="today-head"><h2>Mes examens blancs</h2><span class="muted small">${hist.length} passé${hist.length>1?"s":""} · dernier ${last.s}/40 le ${fmtShort(last.d)}</span></div>
  <div class="chart"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Scores des examens blancs">${ticks}<path d="${area}" fill="var(--accent)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>${dots}<text x="${W-pr}" y="${y(35)-5}" text-anchor="end" font-size="11" fill="var(--good)">Seuil 35</text></svg></div>
  <p class="small muted mt0">${streak>=3?`Tu enchaînes ${streak} examens à 37 ou plus : tu as le niveau pour t'inscrire.`:"Objectif avant de t'inscrire : plusieurs examens d'affilée à 37/40 ou plus."}</p></section>`;
}
function bindActs(){
  app.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>{
    const [a,v]=b.dataset.act.split(":");
    ({home,exam:startExam,errors:()=>startErrors(false),errpractice:()=>startErrors(true),errview:errView,signs:signsView,signquiz:startSignQuiz,keys:keysView,theme:()=>themeView(v),quiz:()=>startTheme(v)})[a]();
  });
}

/* ---------- Thème ---------- */
function themeView(k){
  stopTimer(); const t=T(k), st=status(k);
  app.innerHTML=`<div class="col" style="--c:var(--${k})"><button class="back" data-act="home">← Accueil</button>
  <div class="head"><span class="badge">${k}</span><div><p class="eyebrow mb0">Thème</p><h2>${t.name}</h2><span class="pill ${pillClass(st)}">${st.label}</span></div></div>
  ${t.cours.map(s=>`<section class="course"><h3>${s.h}</h3><ul>${s.items.map(i=>`<li>${i}</li>`).join("")}</ul></section>`).join("")}
  <div class="sticky-cta"><button class="btn" data-act="quiz:${k}" style="background:var(--c);color:#fff">Faire le quiz · ${qCount(k)} questions</button></div></div>`;
  bindActs(); scrollTo(0,0);
}
function startTheme(k){ runQuiz({key:k,mode:"theme",color:`var(--${k})`,title:T(k).name,list:shuffle(Q.filter(q=>q.t===k))}) }
function startExam(){
  let pick=[]; THEMES.forEach(t=>pick.push(...shuffle(Q.filter(q=>q.t===t.k)).slice(0,4)));
  runQuiz({key:"EXAM",mode:"exam",color:"var(--accent)",title:"Examen blanc",list:shuffle(pick)});
}
function startErrors(practice){
  const list=practice?Object.keys(errs).map(id=>Q[+id]).filter(Boolean):errDue();
  if(!list.length) return errView();
  runQuiz({key:"ERR",mode:practice?"errpractice":"errors",color:"var(--bad)",title:"Mes erreurs",list:shuffle(list)});
}

/* ---------- Moteur de quiz ---------- */
function runQuiz(S){
  stopTimer();
  let i=0,score=0,answers=[]; const n=S.list.length, exam=S.mode==="exam";
  let perm,sel;
  function render(){
    const q=S.list[i]; perm=shuffle(q.o.map((_,j)=>j)); sel=new Set();
    const th=q.t?T(q.t):null;
    app.innerHTML=`<div class="col" style="--c:${S.color}"><button class="back" id="quit">← Quitter</button>
    <div class="progress"><span>${S.title} · ${i+1} / ${n}</span>${exam?`<span id="clock" class="clock">${EXAM_SECONDS} s</span>`:`<span>${score} bonne${score>1?"s":""}</span>`}</div>
    <div class="bar"><i style="width:${i/n*100}%"></i></div>
    ${exam?`<div class="timebar"><i id="tb"></i></div>`:""}
    ${th&&S.mode!=="theme"?`<p class="eyebrow">Thème ${q.t} · ${th.name}</p>`:""}
    ${q.img?`<div class="sign-big">${q.img}</div>`:""}
    <p class="q">${esc(q.q)}</p><p class="hint">Une ou plusieurs réponses</p>
    <div class="opts">${perm.map((j,d)=>`<button class="opt" data-j="${j}" aria-pressed="false"><b>${LETTERS[d]}</b><span>${esc(q.o[j])}</span></button>`).join("")}</div>
    <div class="actions"><button class="btn" id="val" disabled style="background:var(--c);color:#fff">Valider</button></div>
    <div id="after"></div></div>`;
    app.querySelector("#quit").onclick=home;
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j; sel.has(j)?sel.delete(j):sel.add(j);
      b.classList.toggle("sel",sel.has(j)); b.setAttribute("aria-pressed",sel.has(j));
      app.querySelector("#val").disabled=!sel.size;
    });
    app.querySelector("#val").onclick=validate;
    if(exam){
      let left=EXAM_SECONDS; const clock=app.querySelector("#clock"), tb=app.querySelector("#tb");
      tb.style.width="100%";
      timer=setInterval(()=>{left--; clock.textContent=left+" s"; tb.style.width=(left/EXAM_SECONDS*100)+"%"; clock.classList.toggle("urgent",left<=5);
        if(left<=0){stopTimer();validate(true)}},1000);
    }
    scrollTo(0,0);
  }
  function validate(timeout){
    stopTimer();
    const q=S.list[i], ok=sel.size===q.a.length&&q.a.every(a=>sel.has(a));
    answers.push([...sel]); if(ok)score++;
    let errNote="";
    if(!ok) markWrong(q);
    else if(S.mode==="errors"){const r=markErrRight(q); errNote=r==="acquise"?"Question ancrée : elle sort de tes erreurs.":r?`Prochain rappel : J+${ERR_STEPS[r.step]}.`:""}
    if(exam){ next(); return }
    app.querySelectorAll(".opt").forEach(b=>{const j=+b.dataset.j;b.disabled=true;if(q.a.includes(j))b.classList.add("ok");else if(sel.has(j))b.classList.add("ko")});
    app.querySelector("#val").remove();
    const good=q.a.map(a=>LETTERS[perm.indexOf(a)]).sort().join(" et ");
    const last=i===n-1;
    const after=app.querySelector("#after");
    after.innerHTML=`<div class="fb ${ok?"ok":"ko"}"><strong>${ok?"Bonne réponse":"Mauvaise réponse · réponse attendue : "+good}</strong>${esc(q.x)}${errNote?`<div class="small muted" style="margin-top:6px">${errNote}</div>`:""}</div>
    <div class="actions"><button class="btn" id="next" style="background:var(--c);color:#fff">${last?"Voir le résultat":"Question suivante"}</button></div>`;
    const nx=after.querySelector("#next"); nx.focus({preventScroll:true}); nx.onclick=next;
  }
  function next(){ if(i===n-1) finish(); else {i++;render()} }
  function finish(){
    stopTimer();
    if(S.key&&S.mode!=="errpractice"&&(best[S.key]==null||score>best[S.key])){best[S.key]=score;store.set("atp-best",best)}
    const pass=exam?score>=35:score/n>=PASS_RATE;
    let extra="";
    if(S.mode==="theme"){
      const prev=sched[S.key]?sched[S.key].step:null, s=updateSched(S.key,score/n);
      const msg=prev==null?"Premier passage fait.":pass?(s.step>prev?"Palier suivant débloqué.":"Palier conservé."):"Moins de 80 % : retour à J+1.";
      extra=`<div class="next-box"><span class="eyebrow">Prochaine révision · J+${STEPS[s.step]}</span><b>${fmtDate(s.due)}</b><small class="muted">${msg}</small></div>`;
    }
    if(exam){hist.push({d:todayKey(),s:score});hist=hist.slice(-50);store.set("atp-hist",hist)}
    if(S.mode==="signs"){best.SIGNS=Math.max(best.SIGNS||0,score);store.set("atp-best",best)}
    const verdict=exam?(pass?"Examen réussi":"Examen échoué · il faut 35/40"):S.mode.startsWith("err")?`${Object.keys(errs).length} question${Object.keys(errs).length>1?"s":""} encore en cours d'ancrage`:(pass?"Bien maîtrisé":"Encore un peu de révision");
    const wrong=S.list.map((q,k)=>({q,s:answers[k]})).filter(r=>!(r.s.length===r.q.a.length&&r.q.a.every(a=>r.s.includes(a))));
    const again={theme:()=>startTheme(S.key),exam:startExam,errors:()=>startErrors(false),errpractice:()=>startErrors(true),signs:startSignQuiz}[S.mode];
    app.innerHTML=`<div class="col" style="--c:${S.color}"><div class="result"><p class="eyebrow">${S.title}</p>
    <div class="big">${score}<span class="of">/${n}</span></div>
    <span class="verdict ${pass?"ok":"ko"}">${verdict}</span></div>${extra}
    <div class="actions center"><button class="btn" id="again" style="background:var(--c);color:#fff">Recommencer</button><button class="btn ghost" data-act="home">Accueil</button></div>
    ${wrong.length?`<p class="eyebrow mt">À revoir (${wrong.length})${S.mode!=="signs"?" · ajoutées à Mes erreurs":""}</p><div class="review">${wrong.map(r=>`
      <div class="rv" style="border-left-color:${r.q.t?`var(--${r.q.t})`:"var(--bad)"}">${r.q.t?`<span class="m">Thème ${r.q.t} · ${T(r.q.t).name}</span>`:""}
      ${r.q.img?`<div class="sign-sm">${r.q.img}</div>`:""}<p><b>${esc(r.q.q)}</b></p>
      <p>Ta réponse : ${r.s.length?r.s.map(j=>esc(r.q.o[j])).join(" + "):"<i>pas de réponse (temps écoulé)</i>"}<br>Bonne réponse : <b>${r.q.a.map(j=>esc(r.q.o[j])).join(" + ")}</b></p><p class="m">${esc(r.q.x)}</p></div>`).join("")}</div>`:`<p class="center mt">Aucune erreur, bravo !</p>`}</div>`;
    app.querySelector("#again").onclick=again; bindActs(); scrollTo(0,0);
  }
  render();
}

/* ---------- Mes erreurs ---------- */
function errView(){
  stopTimer();
  const ids=Object.keys(errs), ed=errDue();
  const byTheme=THEMES.map(t=>({t,n:ids.filter(id=>Q[+id]&&Q[+id].t===t.k).length})).filter(x=>x.n);
  const nextDue=ids.map(id=>errs[id].due).sort()[0];
  app.innerHTML=`<div class="col" style="--c:var(--bad)"><button class="back" data-act="home">← Accueil</button>
  <h2>Mes erreurs</h2><p class="lede">Chaque question ratée, dans n'importe quel quiz ou examen, arrive ici. Elle revient à J+1, puis J+3, puis J+7. Après 3 bonnes réponses d'affilée, elle est ancrée et sort de la liste. Une nouvelle erreur la renvoie à J+1.</p>
  <div class="stats mt"><div><b>${ids.length}</b><span>En cours</span></div><div><b>${ed.length}</b><span>À revoir aujourd'hui</span></div></div>
  ${byTheme.length?`<div class="chips">${byTheme.map(x=>`<span class="chip" style="--c:var(--${x.t.k})"><i></i>${x.t.k} · ${x.t.name} : ${x.n}</span>`).join("")}</div>`:""}
  <div class="actions">${ed.length?`<button class="btn" data-act="errors" style="background:var(--c);color:#fff">Revoir les ${ed.length} question${ed.length>1?"s":""} du jour</button>`:ids.length?`<p class="mt0">Rien à revoir aujourd'hui. Prochain rappel le ${fmtDate(nextDue)}.</p>`:`<p class="mt0">Aucune erreur pour l'instant. Fais un quiz ou un examen blanc : tes erreurs arriveront ici.</p>`}
  ${ids.length?`<button class="btn ghost" data-act="errpractice">M'entraîner sur toutes mes erreurs</button>`:""}</div></div>`;
  bindActs(); scrollTo(0,0);
}

/* ---------- Panneaux ---------- */
function signsView(){
  stopTimer();
  const cats=[...new Set(SIGNS.map(s=>s.c))];
  app.innerHTML=`<div class="col wide"><button class="back" data-act="home">← Accueil</button>
  <div class="head-row"><div><h2>Panneaux</h2><p class="lede">Touche un panneau pour voir sa signification, puis teste-toi.</p></div>
  <button class="btn" data-act="signquiz">Quiz panneaux${best.SIGNS!=null?` · record ${best.SIGNS}/${SIGNS.length}`:""}</button></div>
  ${cats.map(c=>`<p class="eyebrow mt">${c}</p><div class="signs">${SIGNS.filter(s=>s.c===c).map(s=>`<button class="card-sign" data-i="${SIGNS.indexOf(s)}" aria-expanded="false">${signSvg(s,72)}<span class="nm">${s.n}</span><span class="ds" hidden>${s.d}</span></button>`).join("")}</div>`).join("")}</div>`;
  app.querySelectorAll(".card-sign").forEach(b=>b.onclick=()=>{const d=b.querySelector(".ds");d.hidden=!d.hidden;b.setAttribute("aria-expanded",!d.hidden);b.classList.toggle("open",!d.hidden)});
  bindActs(); scrollTo(0,0);
}
function startSignQuiz(){
  const list=shuffle(SIGNS).map(s=>{
    const same=shuffle(SIGNS.filter(o=>o!==s&&o.c===s.c)), other=shuffle(SIGNS.filter(o=>o!==s&&o.c!==s.c));
    const wrong=[...same,...other].slice(0,2);
    return {q:"Que signifie ce panneau ?",img:signSvg(s,130),o:[s.n,...wrong.map(w=>w.n)],a:[0],x:s.d};
  });
  runQuiz({key:"SIGNSQ",mode:"signs",color:"var(--accent)",title:"Quiz panneaux",list});
}

/* ---------- Chiffres clés ---------- */
function keysView(){
  stopTimer();
  app.innerHTML=`<div class="col"><button class="back" data-act="home">← Accueil</button><h2>Chiffres clés</h2><p class="lede">À relire juste avant l'examen.</p>
  ${KEYS.map(k=>`<section class="course"><h3>${k.h}</h3><div class="tablewrap"><table><thead><tr>${k.cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${k.rows.map(r=>`<tr>${r.map((c,i)=>`<td${i?' class="num"':""}>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>`).join("")}
  <p class="foot">Vitesses en km/h. « Jeune conducteur » = permis probatoire.</p></div>`;
  bindActs(); scrollTo(0,0);
}

home();

if("serviceWorker" in navigator){addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
